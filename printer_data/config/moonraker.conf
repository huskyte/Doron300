[update_manager klipper-backup]
type: git_repo
path: ~/klipper-backup
origin: https://github.com/Staubgeborener/klipper-backup.git
managed_services: moonraker
primary_branch: main

# Doron300 Lower telemetry via ESPHome MQTT
[mqtt]
address: 192.168.1.241
port: 1883

[sensor doron_lower_cooling]
type: mqtt
name: Doron Lower Cooling
state_topic: doron300/lower/telemetry
state_response_template:
  {% set data = payload|fromjson %}
  {set_result("control_temperature", data["control_temperature"]|float)}
  {set_result("psu_temperature", data["psu_temperature"]|float)}
  {set_result("ssr_temperature", data["ssr_temperature"]|float)}
  {set_result("fan_target", data["fan_target"]|float)}
parameter_control_temperature:
  units=°C
parameter_psu_temperature:
  units=°C
parameter_ssr_temperature:
  units=°C
parameter_fan_target:
  units=%

[sensor doron_lower_power]
type: mqtt
name: Doron Lower Power
state_topic: doron300/lower/telemetry
state_response_template:
  {% set data = payload|fromjson %}
  {set_result("total_power", data["total_power"]|float)}
  {set_result("power_24v", data["power_24v"]|float)}
  {set_result("hv_power", data["hv_power"]|float)}
  {set_result("voltage_24v", data["voltage_24v"]|float)}
  {set_result("current_24v", data["current_24v"]|float)}
parameter_total_power:
  units=W
parameter_power_24v:
  units=W
parameter_hv_power:
  units=W
parameter_voltage_24v:
  units=V
parameter_current_24v:
  units=A
